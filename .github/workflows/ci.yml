name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify generated CommonJS build is current
        shell: bash
        run: |
          cp cjs/index.cjs /tmp/jwtguard-cjs-before.cjs
          node scripts/build-cjs.mjs
          diff -u /tmp/jwtguard-cjs-before.cjs cjs/index.cjs
      - name: Run deterministic test suite
        shell: bash
        run: node --test tests/*.test.mjs
