name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated CommonJS build is current
        shell: bash
        run: |
          cp cjs/index.cjs /tmp/jwtguard-cjs-before.cjs
          node scripts/build-cjs.mjs
          diff -u /tmp/jwtguard-cjs-before.cjs cjs/index.cjs
      - name: Run deterministic test suite
        shell: bash
        run: node --test tests/*.test.mjs
      - name: Run fast-check property fuzz tests
        run: npm run test:fuzz
